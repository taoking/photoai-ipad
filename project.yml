# XcodeGen 配置：`xcodegen generate` 生成 PhotoAI-iPad.xcodeproj（工程文件不进仓库）。
name: PhotoAI-iPad
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
packages:
  PhotoAICore:
    path: Packages/PhotoAICore
targets:
  PhotoAI-iPad:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: PhotoAICore
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: PhotoAI
        TARGETED_DEVICE_FAMILY: "2"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # 生成的 Info.plist 再合并这个文件（继续处理任务的标识符，F-07）。
        INFOPLIST_FILE: Config/Info.plist
        # 应用图标（F-52）：Scripts/make-icon.sh 生成。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: PhotoAI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # 在“文件”App 里能看到 Documents（技术验证日志放这里）。
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        # 存到“照片”（F-33）只申请添加照片。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 把选中的照片存进“照片”App（只添加，不读你的图库）。
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  # 网格交互的界面测试，只在模拟器上跑（用合成库，不碰卡）。
  PhotoAI-iPadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: PhotoAI-iPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2"
        PRODUCT_BUNDLE_IDENTIFIER: local.photoai.uitests
        TEST_TARGET_NAME: PhotoAI-iPad
schemes:
  PhotoAI-iPad:
    build:
      targets:
        PhotoAI-iPad: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhotoAI-iPadUITests
    archive:
      config: Release
